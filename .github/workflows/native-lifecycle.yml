name: Offline TDLib Native Lifecycle

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lifecycle:
    name: Native lifecycle — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-x64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify Apple-silicon runner
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Exercise native clients without credentials or session initialization
        shell: pwsh
        env:
          KTM_BUILD_DIR: build
        # The test only issues version/auth-state/alarm/close requests. It never
        # sets TDLib parameters, configures storage or attempts a Telegram login.
        run: |
          $wrapper = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $wrapper nativeTest --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lifecycle-${{ matrix.target }}
          path: |
            build/test-results/nativeTest/**
            build/reports/tests/nativeTest/**
          if-no-files-found: ignore
          retention-days: 7
