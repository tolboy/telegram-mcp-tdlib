name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew clean test bootJar verifyNativeRuntimeCoverage verifyReleaseMetadata --no-daemon

      - name: Retain JVM failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-failure-reports
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate and package companion skill
        run: python3 scripts/package-telegram-skill.py

      - name: Verify independent MCP results and tools bridge
        run: |
          python3 -m venv build/mcp-client-venv
          build/mcp-client-venv/bin/python -m pip install -r scripts/requirements-mcp-client.txt
          build/mcp-client-venv/bin/python -m unittest discover -s scripts/tests -v
          build/mcp-client-venv/bin/python scripts/mcp-result-smoke.py --jar build/libs/telegram-mcp-server.jar

      - name: Verify production image build
        run: docker build --build-arg APP_VERSION=ci -t telegram-mcp-server:ci .

  windows-daemon-lifetime:
    runs-on: windows-latest
    env:
      KTM_BUILD_DIR: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build runnable JAR
        run: ./gradlew.bat bootJar --no-daemon
      - name: Verify ordinary and restrictive host Job Object shutdown
        run: python scripts/test-windows-daemon-job.py --jar build/libs/telegram-mcp-server.jar
