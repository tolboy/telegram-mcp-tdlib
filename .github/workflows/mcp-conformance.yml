name: MCP conformance

# Manual only. conformance 0.1.16 cannot send Authorization, so the script
# proxies the isolated daemon's generated key on loopback. This is not a
# pull-request check and it does not call Telegram.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build runnable JAR
        run: ./gradlew bootJar --no-daemon

      - name: Run conformance for protocol 2025-11-25
        run: python3 scripts/mcp-conformance.py --jar build/libs/telegram-mcp-server.jar --spec-version 2025-11-25
